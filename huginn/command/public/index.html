<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-seCLxFfQToKeWoPJAMxxTkPU81nIj/JsvrOdN9OtJwI='; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huginn</title>
<meta name="theme-color" content="#0F1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huginn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/huginn-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-label="Live map of the home network. Your router is in the middle, devices circle it, and the internet forms the outer ring, grouped by owner. Drag to move, pinch or scroll to zoom."></canvas>

<header class="mark">
  <h1>Huginn</h1>
  <p id="status">Waking up</p>
  <p id="phNote" class="phNote" hidden></p>
</header>

<section class="vitals" aria-label="How things are at home">
  <button id="homeState" class="homeState" type="button" aria-live="polite">Checking your home network</button>
  <p id="line" class="line">Measuring the line.</p>
  <dl>
    <div class="v down"><dt>Down</dt><dd><span id="down">0</span><small>Mb/s</small></dd><svg id="downSpark" viewBox="0 0 120 24" preserveAspectRatio="none"></svg></div>
    <div class="v up"><dt>Up</dt><dd><span id="up">0</span><small>Mb/s</small></dd><svg id="upSpark" viewBox="0 0 120 24" preserveAspectRatio="none"></svg></div>
    <div class="v ms"><dt>Router</dt><dd><span id="router">-</span><small>ms</small></dd><svg id="routerSpark" viewBox="0 0 120 24" preserveAspectRatio="none"></svg></div>
    <div class="v ms"><dt>Internet</dt><dd><span id="net">-</span><small>ms</small></dd><svg id="netSpark" viewBox="0 0 120 24" preserveAspectRatio="none"></svg></div>
  </dl>
</section>

<aside class="log" aria-label="Packets as they fly">
  <div class="logHead">
    <h2>Live activity</h2>
    <span id="pps">0 packets a second</span>
  </div>
  <ol id="log" aria-live="off"></ol>
</aside>

<div class="zoom" role="group" aria-label="Map zoom">
  <button id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <button id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out (-)">−</button>
  <button id="zoomFit" type="button" aria-label="Fit the whole map" title="Fit (0)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/></svg></button>
</div>

<ul class="legend" aria-label="What the spark colors mean">
  <li class="k-out">Leaving this PC</li>
  <li class="k-in">Coming back</li>
  <li class="k-dns">Asking for a website</li>
  <li class="k-blocked">Blocked ad or tracker</li>
  <li class="k-lan">Inside the house</li>
  <li class="k-chatter">Devices announcing themselves</li>
</ul>

<footer class="timeline">
  <div class="tools">
    <button id="live" type="button" aria-pressed="false" title="Space">Pause</button>
    <button id="devicesBtn" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v9H5z M9 19h6 M12 15v4"/></svg><span class="tl">Devices</span><span class="count"></span></button>
    <button id="houseBtn" type="button" aria-haspopup="true" aria-expanded="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7 M6 9.5V20h12V9.5"/></svg><span class="tl">View</span></button>
    <button id="zonesBtn" type="button" aria-pressed="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z M14 3.3A9 9 0 0 1 20.7 10H14z"/></svg><span class="tl">Zones</span></button>
    <button id="unusualBtn" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20.5h4"/></svg><span class="tl">Alerts</span><span class="count"></span></button>
    <button id="scanBtn" type="button" hidden>Scan now</button>
    <button id="rewindBtn" type="button" aria-pressed="false">Rewind</button>
    <button id="logBtn" type="button" aria-pressed="false">Log</button>
    <button id="moreBtn" type="button"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01 M12 12h.01 M19 12h.01"/></svg><span class="tl">More</span></button>
  </div>
  <div class="tlWrap">
    <canvas id="tl" aria-label="The last hour of traffic. Download above the line, upload below. Hover to see who was busiest."></canvas>
    <div id="tlTip" class="tlTip" hidden></div>
  </div>
</footer>

<div id="housePanel" class="housePanel" hidden></div>

<div id="replayBar" class="replayBar" hidden aria-live="off">
  <div class="rbTime"><small>Replaying</small><b id="rbClock">-</b></div>
  <div class="rbBtns">
    <button type="button" data-rb="back" aria-label="Back one minute">-1 min</button>
    <button type="button" data-rb="play" id="rbPlay">Pause</button>
    <button type="button" data-rb="speed" id="rbSpeed" aria-label="Playback speed">1x</button>
    <button type="button" data-rb="fwd" aria-label="Forward one minute">+1 min</button>
    <button type="button" data-rb="live" class="primary">Back to live</button>
  </div>
  <p id="rbNote" class="rbNote"></p>
</div>

<div id="watchHud" class="watchHud" hidden aria-live="polite"></div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<aside id="drawer" class="drawer" hidden aria-live="polite">
  <button id="close" class="close" type="button" aria-label="Close">×</button>
  <div id="drawerBody"></div>
</aside>

<div id="tip" class="tip" hidden></div>

<script src="app.js"></script>
<script src="replay.js"></script>
<script src="house.js"></script>
<script src="zones.js"></script>
<script src="unusual.js"></script>
<script src="native.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module" src="holo.js"></script>
</body>
</html>
